[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lmcode-python"
version = "0.1.0"
description = "Pure Python loader, verifier, VM, and host SDK for lmcode bytecode"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Lattice Systems LLC"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Interpreters",
]
dependencies = []

[project.scripts]
lmcode-python-sample = "sample.main:run"

[tool.setuptools]
packages = ["lmcode", "lmcode.rest", "sample"]
include-package-data = true

[tool.setuptools.package-data]
lmcode = ["py.typed", "data/*.json"]
sample = ["data/*.json"]
